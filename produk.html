    <style>
        :root {
            --salim-red: #ba0c18;
            --salim-red-hover: #960812;
            --salim-green: #008d4c;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            overflow-x: hidden;
        }

        .container {
            width: 92%;
            max-width: 1250px;
            margin: 0 auto;
        }

        /* Header Navigation Selaras Homepage */
        header {
            background: var(--salim-red);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(186, 12, 24, 0.2);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-group img {
            height: 45px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.88);
            font-size: 1rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .nav-links a:hover, .nav-links a.active {
            color: #ffffff;
        }

        .nav-links a.active {
            position: relative;
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--salim-green);
            border-radius: 2px;
        }

        /* Header "Our Products" & Search Bar */
        .catalog-header {
            padding: 2.5rem 0 1rem 0;
            text-align: center;
        }

        .catalog-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 1.2rem;
            letter-spacing: -0.5px;
        }

        .search-box {
            max-width: 520px;
            margin: 0 auto;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            font-size: 0.95rem;
            outline: none;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--salim-red);
            box-shadow: 0 4px 14px rgba(186, 12, 24, 0.12);
        }

        .search-box i {
            position: absolute;
            left: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Category Filter Memanjang Satu Baris */
        .category-filter-wrapper {
            margin: 1.8rem 0 2rem 0;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: thin;
        }

        .category-filter-wrapper::-webkit-scrollbar {
            height: 4px;
        }

        .category-filter-wrapper::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .category-filter {
            display: flex;
            gap: 0.6rem;
            flex-wrap: nowrap;
            white-space: nowrap;
            width: max-content;
            margin: 0 auto;
        }

        .filter-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 0.5rem 1.1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
        }

        .filter-btn:hover {
            border-color: var(--salim-red);
            color: var(--salim-red);
            background: #fff5f5;
        }

        .filter-btn.active {
            background: var(--salim-red);
            color: #ffffff;
            border-color: var(--salim-red);
        }

        /* Grid Produk */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.2rem;
            margin-bottom: 4rem;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            border-color: #cbd5e1;
        }

        /* Gambar Produk */
        .product-img-box {
            width: 100%;
            height: 180px;
            background-color: #ffffff;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
        }

        .product-img-box img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .product-content {
            padding: 0.9rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.3rem;
            line-height: 1.3;
            min-height: 2.4em;
        }

        .product-spec {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Harga Paket & Kotak */
        .price-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: #f8fafc;
            border: 1px solid #edf2f7;
            padding: 8px;
            border-radius: 8px;
            margin-top: auto;
        }

        .price-item {
            display: flex;
            flex-direction: column;
        }

        .price-item .label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .price-item .value {
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--salim-red);
        }

        .price-item.box .value {
            color: #0f172a;
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 1rem;
                padding: 0.8rem 0;
            }
            .nav-links {
                gap: 1.2rem;
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 600px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.8rem;
            }
            .product-content {
                padding: 0.7rem;
            }
            .product-title {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .logo-group img {
                height: 36px;
            }
            .nav-links a {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

    function initFilterTabs() {
        const filterContainer = document.getElementById('categoryFilter');

        let html = `
            <button class="filter-btn active" onclick="filterCategory('all', this)">All</button>
        `;

        Object.keys(catalogData).forEach(cat => {
            html += `
                <button class="filter-btn" onclick="filterCategory('${cat}', this)">${cat}</button>
            `;
        });

        filterContainer.innerHTML = html;
    }

    function filterCategory(category, element) {
        activeCategory = category;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        renderProducts();
    }

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        const search = document.getElementById('searchInput').value.toLowerCase().trim();
        grid.innerHTML = '';

        let items = [];

        Object.keys(catalogData).forEach(cat => {
            if (activeCategory === 'all' || activeCategory === cat) {
                catalogData[cat].forEach(item => {
                    if (!search || item.name.toLowerCase().includes(search) || item.spec.toLowerCase().includes(search)) {
                        items.push({ ...item, category: cat });
                    }
                });
            }
        });

        if (items.length === 0) {
            grid.innerHTML = `
                <div class="no-results">
                    <i class="fa-solid fa-box-open" style="font-size: 2rem; margin-bottom: 0.5rem; color: #cbd5e1;"></i>
                    <p>Tiada produk dijumpai mengikut carian anda.</p>
                </div>
            `;
            return;
        }

        items.forEach(item => {
            const pktStr = item.pkt !== '-' ? `RM ${item.pkt}` : '-';
            const boxStr = item.box !== '-' ? `RM ${item.box}` : '-';

            const card = document.createElement('div');
            card.className = 'product-card';

            card.innerHTML = `
                <div class="product-img-box">
                    <img src="productpic/${item.img}" alt="${item.name}">
                </div>
                <div class="product-content">
                    <h3 class="product-title">${item.name}</h3>
                    <div class="product-spec">
                        <i class="fa-solid fa-cube"></i> ${item.spec}
                    </div>
                    
                    <div class="price-grid">
                        <div class="price-item">
                            <span class="label">Paket</span>
                            <span class="value">${pktStr}</span>
                        </div>
                        <div class="price-item box">
                            <span class="label">Kotak</span>
                            <span class="value">${boxStr}</span>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }
    </script>
</body>
</html>
