    <style>
        :root {
            --salim-red: #ba0c18;
            --salim-red-hover: #960812;
            --salim-green: #008d4c;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: clip;
            position: relative;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* Protect Font Awesome pseudo-elements from font resets */
        .fa-solid, .fa-brands, .fa-regular {
            font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands" !important;
        }

        .site-wrapper {
            width: 100%;
            max-width: 100%;
            overflow-x: clip;
            position: relative;
        }

        main-header {
            display: block;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Marquee Banner Styling */
        .marquee-banner {
            background-color: #1e293b; /* Distinct dark navy background */
            color: #f8fafc;
            padding: 8px 0;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 999;
        }

        .marquee-banner marquee {
            display: flex;
            align-items: center;
        }

        main-footer {
            display: block;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .container {
            width: 92%;
            max-width: 1250px;
            margin: 0 auto;
        }

        .catalog-header {
            padding: 2.5rem 0 1rem 0;
            text-align: center;
        }

        .catalog-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 1.2rem;
            letter-spacing: -0.5px;
        }

        /* Search Box */
        .search-box {
            max-width: 520px;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            font-size: 0.95rem;
            outline: none;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--salim-red);
            box-shadow: 0 4px 14px rgba(186, 12, 24, 0.12);
        }

        .search-box .search-svg {
            position: absolute;
            left: 1.1rem;
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .category-filter-wrapper {
            margin: 1.8rem 0 2rem 0;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }

        .category-filter {
            display: flex;
            gap: 0.6rem;
            flex-wrap: nowrap;
            white-space: nowrap;
            width: max-content;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .filter-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 0.5rem 1.1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: var(--salim-red);
            color: var(--salim-red);
            background: #fff5f5;
        }

        .filter-btn.active {
            background: var(--salim-red);
            color: #ffffff;
            border-color: var(--salim-red);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.2rem;
            margin-bottom: 4rem;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .product-img-box {
            width: 100%;
            height: 180px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
        }

        .product-img-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-content {
            padding: 0.9rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.3rem;
            line-height: 1.3;
            min-height: 2.4em;
        }

        .product-spec {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .product-spec svg {
            width: 14px;
            height: 14px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
        }

        .price-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: #f8fafc;
            border: 1px solid #edf2f7;
            padding: 8px;
            border-radius: 8px;
            margin-top: auto;
        }

        .price-item {
            display: flex;
            flex-direction: column;
        }

        .price-item .label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .price-item .value {
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--salim-red);
        }

        .price-item.box .value {
            color: #0f172a;
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .category-filter {
                margin: 0;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.8rem;
            }
        }
    </style>
</head>

    let activeCategory = 'all';

    document.addEventListener('DOMContentLoaded', () => {
        initFilterTabs();
        renderProducts();
        document.getElementById('searchInput').addEventListener('input', renderProducts);
    });

    function initFilterTabs() {
        const filterContainer = document.getElementById('categoryFilter');
        filterContainer.innerHTML = '';
        
        const createBtn = (cat, label, active = false) => {
            const btn = document.createElement('button');
            btn.className = `filter-btn ${active ? 'active' : ''}`;
            btn.textContent = label;
            btn.dataset.category = cat;
            btn.addEventListener('click', (e) => filterCategory(cat, e.currentTarget));
            return btn;
        };

        filterContainer.appendChild(createBtn('all', 'All', true));

        Object.keys(catalogData).forEach(cat => {
            filterContainer.appendChild(createBtn(cat, cat));
        });
    }

    function filterCategory(category, element) {
        activeCategory = category;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        element.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        renderProducts();
    }

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        const search = document.getElementById('searchInput').value.toLowerCase().trim();
        grid.innerHTML = '';

        let items = [];

        Object.keys(catalogData).forEach(cat => {
            if (activeCategory === 'all' || activeCategory === cat) {
                catalogData[cat].forEach(item => {
                    if (!search || item.name.toLowerCase().includes(search) || item.spec.toLowerCase().includes(search)) {
                        items.push({ ...item, category: cat });
                    }
                });
            }
        });

        if (items.length === 0) {
            grid.innerHTML = `
                <div class="no-results">
                    <p>No products found matching your search query.</p>
                </div>
            `;
            return;
        }

        const cubeSvg = `<svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>`;

        items.forEach(item => {
            const pktStr = item.pkt !== '-' ? `RM ${item.pkt}` : '-';
            const boxStr = item.box !== '-' ? `RM ${item.box}` : '-';

            const card = document.createElement('div');
            card.className = 'product-card';

            card.innerHTML = `
                <div class="product-img-box">
                    <img src="productpic/${item.img}" alt="${item.name}" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/200x180/f1f5f9/64748b?text=No+Image';">
                </div>
                <div class="product-content">
                    <h3 class="product-title">${item.name}</h3>
                    <div class="product-spec">
                        ${cubeSvg} ${item.spec}
                    </div>
                    <div class="price-grid">
                        <div class="price-item">
                            <span class="label">Packet</span>
                            <span class="value">${pktStr}</span>
                        </div>
                        <div class="price-item box">
                            <span class="label">Box</span>
                            <span class="value">${boxStr}</span>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }
    </script>
</body>
</html>
