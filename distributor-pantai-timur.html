            font-weight: 600;

        .nav-links a:hover, .nav-links a.active {
            color: #ffffff;
        }

        .nav-links a.active {
            position: relative;
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--salim-green);
            border-radius: 2px;

            { name: "TF VALUE-MART SDN BHD (CAMERON HIGHLANDS)", phone: "60138552051", city: "CAMERON HIGHLANDS", attention: "MR GAFFAR", state: "Pahang", type: "wa", link: "https://wa.me/60138552051" }
        ];

        // Sort all distributors alphabetically (A to Z) by name
        distributorsData.sort((a, b) => a.name.localeCompare(b.name));

        let activeStateFilter = 'all';

        function setFilterState(state, btn) {
            activeStateFilter = state;
            
            // Toggle active class on state filter buttons
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            renderDistributors();
        }

        function createCardHTML(item) {
            const buttonHTML = item.type === 'wa' 
                ? `<a href="${item.link}" target="_blank" class="btn-whatsapp"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>`
                : `<a href="${item.link}" class="btn-call"><i class="fa-solid fa-phone"></i> Call</a>`;

            const attentionHTML = item.attention 
                ? `<p class="info-row"><i class="fa-solid fa-user"></i> <span><strong>Attention:</strong> ${item.attention}</span></p>` 
                : '';

            return `
                <div class="distributor-card">
                    <div class="card-header">
                        <h3>${item.name}</h3>
                    </div>
                    <div class="card-details">
                        <p class="info-row"><i class="fa-solid fa-phone"></i> <span><strong>Tel:</strong> ${item.phone}</span></p>
                        <p class="info-row"><i class="fa-solid fa-map-pin"></i> <span><strong>State:</strong> ${item.state}</span></p>
                        <p class="info-row"><i class="fa-solid fa-city"></i> <span><strong>City:</strong> ${item.city}</span></p>
                        ${attentionHTML}
                    </div>
                    <div class="card-actions">
                        ${buttonHTML}
                    </div>
                </div>
            `;
        }

        function renderDistributors() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const displayContainer = document.getElementById('distributorsDisplay');
            const noResults = document.getElementById('noResults');

            // Filter data according to active State tab and search query
            const filteredData = distributorsData.filter(item => {
                const matchesState = (activeStateFilter === 'all' || item.state.toLowerCase() === activeStateFilter.toLowerCase());
                
                const matchesSearch = !searchQuery || 
                    item.name.toLowerCase().includes(searchQuery) || 
                    item.city.toLowerCase().includes(searchQuery) || 
                    item.state.toLowerCase().includes(searchQuery) ||
                    item.phone.includes(searchQuery);

                return matchesState && matchesSearch;
            });

            if (filteredData.length === 0) {
                displayContainer.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';

            // IF "ALL" IS SELECTED: Display as ONE combined single grid (Alphabetical A-Z, no state headers)
            if (activeStateFilter === 'all') {
                const cardsHTML = filteredData.map(item => createCardHTML(item)).join('');
                displayContainer.innerHTML = `
                    <div class="distributor-grid">
                        ${cardsHTML}
                    </div>
                `;
            } else {
                // IF A SPECIFIC STATE IS SELECTED: Show State Header Title
                const stateNameFormatted = activeStateFilter.charAt(0).toUpperCase() + activeStateFilter.slice(1);
                const cardsHTML = filteredData.map(item => createCardHTML(item)).join('');
                
                displayContainer.innerHTML = `
                    <h2 class="section-header-title"><i class="fa-solid fa-location-dot"></i> ${stateNameFormatted}</h2>
                    <div class="distributor-grid">
                        ${cardsHTML}
                    </div>
                `;
            }
        }

        // Initial rendering on page load
        document.addEventListener('DOMContentLoaded', renderDistributors);
    </script>
